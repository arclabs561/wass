[package]
name = "wass"
version = "0.2.2"
authors = ["Arc <attobop@gmail.com>"]
edition = "2021"
rust-version = "1.75"
description = "Optimal transport distances"
license = "MIT OR Apache-2.0"
include = [
  "/src/**/*.rs",
  "/examples/**/*.rs",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE*",
  "/README.md",
]
repository = "https://github.com/arclabs561/wass"
homepage = "https://github.com/arclabs561/wass"
documentation = "https://docs.rs/wass"
keywords = ["optimal-transport", "wasserstein", "sinkhorn", "divergence"]
categories = ["algorithms", "science", "mathematics"]

[workspace]

[dependencies]
thiserror = "2.0"
ndarray = "0.17"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
innr = { version = "0.4", optional = true }

[dev-dependencies]
proptest = "1.5"
clump = "0.5"
symproj = "0.1"
text-splitter = "0.32"
criterion = { version = "0.5", features = ["html_reports"] }
# Rosetta cross-language correctness fixtures (tests/rosetta_*.rs).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "sinkhorn_bench"
harness = false

[features]
default = []
simd = ["dep:innr"]
